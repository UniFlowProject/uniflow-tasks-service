[project]
name = "uniflow-tasks-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.118",
    "boto3-stubs>=1.43.118",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.2.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
